name: PDFCopy
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  PDFCopyCore:
    type: framework
    platform: iOS
    sources: [Sources/PDFCopyCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfcopy.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  PDFCopyIOS:
    type: application
    platform: iOS
    sources:
      - iOS/PDFCopy
      - Sources/PDFCopy/DocumentModel.swift
      - Sources/PDFCopy/PDFSearchModel.swift
      - Sources/PDFCopy/ReadingTools.swift
    dependencies:
      - target: PDFCopyCore
    settings:
      base:
        PRODUCT_NAME: PDFCopy
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfcopy.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PDFCopy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
  PDFCopyIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOS/Tests, Tests/PDFCopyAppTests/PDFSearchTests.swift, Tests/PDFCopyCoreTests/ScanTextLayerTests.swift, Tests/PDFCopyCoreTests/OCRCacheTests.swift, Tests/PDFCopyCoreTests/ReadingToolsTests.swift, Tests/PDFCopyAppTests/CacheIntegrationTests.swift]
    dependencies:
      - target: PDFCopyIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfcopy.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PDFCopy.app/PDFCopy"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PDFCopyIOS:
    build:
      targets:
        PDFCopyIOS: all
    test:
      targets: [PDFCopyIOSTests]
